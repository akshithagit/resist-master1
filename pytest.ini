[pytest]
testpaths = automation/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --no-header
    --timeout=45
markers =
    p1: Priority 1 - Critical path tests
    p2: Priority 2 - Important functional tests
    p3: Priority 3 - Extended coverage tests
    module: Test module grouping label
log_cli = true
log_cli_level = INFO
log_format = [%(asctime)s] [%(levelname)s] %(message)s
log_date_format = %H:%M:%S
